<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đổi Thưởng - Nông Trại 2.5D</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * { font-family: 'Nunito', sans-serif !important; user-select: none; }
    .farm-input {
      background-color: #FFFFFF; border: 2px solid #D8C3A5; color: #542E14; transition: all 0.2s ease;
    }
    .farm-input:focus {
      outline: none; border-color: #3D8E2D; box-shadow: 0 0 0 3px rgba(61, 142, 45, 0.2);
    }
    .farm-press:active { transform: translateY(3px) !important; box-shadow: 0 1px 0 rgba(0,0,0,0.3) !important; }
    
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    .floating { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#75BFF0] via-[#AEE0FC] to-[#80CF5C] text-[#42250F] flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Trang trí nền -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute top-10 left-10 text-6xl floating">☁️</div>
    <div class="absolute top-20 right-20 text-4xl floating" style="animation-delay: 1s;">☁️</div>
    <div class="absolute -bottom-10 -left-10 text-7xl opacity-80">🌻</div>
    <div class="absolute -bottom-10 -right-10 text-7xl opacity-80">🌳</div>
  </div>

  <div class="relative z-10 w-full max-w-lg">
    <!-- Khung Bảng Gỗ -->
    <div class="bg-gradient-to-b from-[#9C5F35] to-[#713B1A] p-3 sm:p-4 rounded-[2rem] border-[4px] border-[#542E14] shadow-[0_8px_0_#542E14,0_16px_24px_rgba(45,20,5,0.3)] relative">
      <!-- Đinh ốc -->
      <div class="absolute top-2 left-2 w-3 h-3 rounded-full bg-[#D8C2A2] border border-[#542E14]"></div>
      <div class="absolute top-2 right-2 w-3 h-3 rounded-full bg-[#D8C2A2] border border-[#542E14]"></div>
      
      <div class="bg-[#FFFBF2] rounded-2xl border-2 border-[#D8C2A2] p-5 shadow-inner">
        <div class="text-center pb-4 border-b-2 border-[#E6D4BE] mb-4">
          <div class="w-16 h-16 mx-auto bg-amber-100 border-2 border-[#542E14] rounded-2xl flex items-center justify-center text-4xl shadow-inner mb-2 floating">
            🎁
          </div>
          <h1 class="text-2xl font-black text-[#542E14]">TRUNG TÂM ĐỔI QUÀ</h1>
          <p class="text-xs font-bold text-[#83583C]">Nhập mã Voucher nhận từ game để rút tiền</p>
        </div>

        <form id="formRedeem" onsubmit="submitRedeemRequest(event)" class="space-y-4">
          
          <!-- Mã Voucher -->
          <div>
            <label class="block text-xs font-black text-[#542E14] mb-1">Mã Voucher của bạn (FARM-...):</label>
            <input type="text" id="reqCode" required placeholder="Nhập mã Voucher..."
                   class="farm-input w-full px-4 py-2 rounded-xl text-sm font-black uppercase text-center tracking-wider" />
            
            <!-- Hộp hiển thị mệnh giá voucher tự động -->
            <div id="voucherInfoBox" class="hidden mt-3 p-3 bg-emerald-50 border-2 border-emerald-200 rounded-xl flex items-center justify-between transition-all duration-300 transform scale-95 opacity-0">
              <div class="flex flex-col">
                <span class="text-[10px] uppercase font-black text-emerald-600 mb-0.5">Tên TK Liên Kết</span>
                <span id="infoOwner" class="text-sm font-black text-emerald-900 flex items-center gap-1">👤 ...</span>
              </div>
              <div class="flex flex-col items-end">
                <span class="text-[10px] uppercase font-black text-amber-600 mb-0.5">Mệnh Giá Quà</span>
                <span class="text-base font-black text-amber-600 flex items-center gap-1">💰 <span id="infoValue">0</span>đ</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Tên Ngân Hàng -->
            <div>
              <label class="block text-xs font-black text-[#542E14] mb-1">Tên Ngân Hàng:</label>
              <input type="text" id="reqBank" required placeholder="VD: MB Bank, Vietcombank..."
                     class="farm-input w-full px-3 py-2 rounded-xl text-sm font-bold" />
            </div>
            <!-- Số Điện Thoại -->
            <div>
              <label class="block text-xs font-black text-[#542E14] mb-1">Số Điện Thoại:</label>
              <input type="tel" id="reqPhone" required placeholder="Số điện thoại liên hệ"
                     class="farm-input w-full px-3 py-2 rounded-xl text-sm font-bold" />
            </div>
          </div>

          <!-- Số Tài Khoản -->
          <div>
            <label class="block text-xs font-black text-[#542E14] mb-1">Số Tài Khoản (STK):</label>
            <input type="text" id="reqStk" required placeholder="Nhập chính xác số tài khoản..."
                   class="farm-input w-full px-4 py-2 rounded-xl text-sm font-bold" />
          </div>

          <!-- Họ và Tên -->
          <div>
            <label class="block text-xs font-black text-[#542E14] mb-1">Họ và Tên Chủ Tài Khoản:</label>
            <input type="text" id="reqName" required placeholder="Tên in hoa không dấu..." uppercase
                   class="farm-input w-full px-4 py-2 rounded-xl text-sm font-bold uppercase" />
          </div>

          <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-[11px] font-bold text-amber-800 text-center">
            ⚠️ Lưu ý: Thông tin sai lệch sẽ bị admin từ chối. Vui lòng kiểm tra kỹ STK và Tên Ngân Hàng trước khi gửi.
          </div>

          <!-- Nút Gửi -->
          <button type="submit" id="btnSubmitRedeem" class="farm-press w-full bg-[#FFAC1C] hover:bg-[#F59E0B] text-[#542E14] font-black py-3 rounded-xl border-2 border-[#542E14] shadow-[0_4px_0_#542E14] text-sm uppercase tracking-wide transition-all duration-200">
            🚀 Gửi Yêu Cầu Cho Admin
          </button>
        </form>

        <div class="mt-4 text-center">
           <a href="index.html" class="text-xs font-black text-[#3D8E2D] hover:underline">Quay lại cổng game</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const GAME_STATE_PREFIX = 'cozy_farm_v3_state_';
    const WITHDRAW_KEY = 'cozy_farm_withdraw_requests';
    const ADMIN_DATA_KEY = 'cozy_farm_admin_data';

    function playSound(type) {
      try {
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -10;
        if (type === 'success') synth.triggerAttackRelease(["C5", "E5", "G5"], "16n");
        if (type === 'error') synth.triggerAttackRelease(["F4", "C4"], "8n");
      } catch(e) {}
    }

    function submitRedeemRequest(e) {
      e.preventDefault();
      
      const code = document.getElementById('reqCode').value.trim().toUpperCase();
      const bank = document.getElementById('reqBank').value.trim();
      const phone = document.getElementById('reqPhone').value.trim();
      const stk = document.getElementById('reqStk').value.trim();
      const fullName = document.getElementById('reqName').value.trim().toUpperCase();

      // 1. Đọc dữ liệu hệ thống
      let adminData = { cashedVouchers: [] };
      try { adminData = JSON.parse(localStorage.getItem(ADMIN_DATA_KEY)) || {cashedVouchers:[]}; } catch(e){}
      
      let requests = [];
      try { requests = JSON.parse(localStorage.getItem(WITHDRAW_KEY)) || []; } catch(e){}

      // 2. Kiểm tra xem mã đã bị Admin gạch (thanh toán) chưa?
      if (adminData.cashedVouchers && adminData.cashedVouchers.some(v => v.code === code)) {
        playSound('error');
        alert("❌ Mã Voucher này đã được thanh toán rồi!");
        return;
      }

      // 3. Kiểm tra xem mã này đã được gửi yêu cầu và đang chờ duyệt chưa?
      if (requests.some(r => r.code === code && r.status === 'pending')) {
        playSound('error');
        alert("⏳ Mã này đang trong danh sách chờ Admin duyệt. Xin vui lòng kiên nhẫn!");
        return;
      }

      // 4. Quét toàn bộ LocalStorage để xác thực xem mã này CÓ THẬT SỰ TỒN TẠI trong tài khoản người chơi không
      let foundVoucher = null;
      let voucherOwner = '';

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith(GAME_STATE_PREFIX)) {
          let state = null;
          try { state = JSON.parse(localStorage.getItem(key)); } catch(e){}
          if (state && state.redeemedHistory) {
            const v = state.redeemedHistory.find(item => item.code === code);
            if (v) {
              foundVoucher = v;
              voucherOwner = state.username || key.replace(GAME_STATE_PREFIX, '');
              break;
            }
          }
        }
      }

      if (!foundVoucher) {
        playSound('error');
        alert("❌ Mã Voucher không tồn tại trong hệ thống! Vui lòng kiểm tra lại mã.");
        return;
      }

      // 5. Nếu hợp lệ -> Đưa vào danh sách chờ duyệt
      const valueNum = parseInt(foundVoucher.value.replace('K', '')) * 1000;
      
      const newRequest = {
        id: 'REQ-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
        code: code,
        value: valueNum,
        playerAccount: voucherOwner,
        fullName: fullName,
        bank: bank,
        stk: stk,
        phone: phone,
        status: 'pending', // pending, approved, rejected
        createdAt: new Date().toLocaleString('vi-VN')
      };

      requests.push(newRequest);
      localStorage.setItem(WITHDRAW_KEY, JSON.stringify(requests));

      // Lưu lại thông tin thanh toán cho lần sau (Tên, Ngân hàng, STK, SĐT)
      const profileToSave = {
        bank: bank,
        phone: phone,
        stk: stk,
        fullName: fullName
      };
      localStorage.setItem('cozy_farm_withdraw_profile', JSON.stringify(profileToSave));

      playSound('success');
      alert(`✅ Gửi yêu cầu rút ${valueNum.toLocaleString()} VNĐ thành công!\nVui lòng chờ Admin đối soát và chuyển khoản.`);
      
      // Reset form
      document.getElementById('formRedeem').reset();
      document.getElementById('voucherInfoBox').classList.add('hidden');
    }

    // --- Tự động tải thông tin đã lưu khi vào trang ---
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedProfile = JSON.parse(localStorage.getItem('cozy_farm_withdraw_profile'));
        if (savedProfile) {
          if(savedProfile.bank) document.getElementById('reqBank').value = savedProfile.bank;
          if(savedProfile.phone) document.getElementById('reqPhone').value = savedProfile.phone;
          if(savedProfile.stk) document.getElementById('reqStk').value = savedProfile.stk;
          if(savedProfile.fullName) document.getElementById('reqName').value = savedProfile.fullName;
        }
      } catch(e){}
    });

    // --- Lắng nghe sự kiện gõ mã Voucher để kiểm tra ngay lập tức ---
    document.getElementById('reqCode').addEventListener('input', function(e) {
      const code = e.target.value.trim().toUpperCase();
      const infoBox = document.getElementById('voucherInfoBox');
      const infoOwner = document.getElementById('infoOwner');
      const infoValue = document.getElementById('infoValue');
      const btnSubmit = document.getElementById('btnSubmitRedeem');

      // Các class màu sắc cho các trạng thái
      const bgClasses = ['bg-emerald-50', 'bg-red-50', 'bg-amber-50', 'bg-slate-100'];
      const borderClasses = ['border-emerald-200', 'border-red-200', 'border-amber-200', 'border-slate-300'];
      
      if (code.length < 5) {
        infoBox.classList.add('hidden');
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed', 'grayscale');
        return;
      }

      let foundVoucher = null;
      let voucherOwner = '';

      // 1. Tìm mã trong dữ liệu của tất cả người chơi
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith(GAME_STATE_PREFIX)) {
          let state = null;
          try { state = JSON.parse(localStorage.getItem(key)); } catch(err){}
          if (state && state.redeemedHistory) {
            const v = state.redeemedHistory.find(item => item.code === code);
            if (v) {
              foundVoucher = v;
              voucherOwner = state.username || key.replace(GAME_STATE_PREFIX, '');
              break;
            }
          }
        }
      }

      // 2. Lấy dữ liệu từ Admin và danh sách chờ duyệt
      let adminData = { cashedVouchers: [] };
      try { adminData = JSON.parse(localStorage.getItem(ADMIN_DATA_KEY)) || {cashedVouchers:[]}; } catch(err){}
      
      let requests = [];
      try { requests = JSON.parse(localStorage.getItem(WITHDRAW_KEY)) || []; } catch(err){}

      // Xóa màu cũ
      infoBox.classList.remove(...bgClasses, ...borderClasses, 'hidden', 'scale-95', 'opacity-0');
      infoBox.classList.add('scale-100', 'opacity-100');

      if (foundVoucher) {
        const valueNum = parseInt(foundVoucher.value.replace('K', '')) * 1000;
        infoValue.textContent = valueNum.toLocaleString();

        const isCashed = adminData.cashedVouchers && adminData.cashedVouchers.some(v => v.code === code);
        const isPending = requests.some(r => r.code === code && r.status === 'pending');

        if (isCashed) {
          // Trạng thái: Đã Thanh Toán
          infoBox.classList.add('bg-slate-100', 'border-slate-300');
          infoOwner.parentElement.querySelector('span:first-child').className = "text-[10px] uppercase font-black text-slate-500 mb-0.5";
          infoOwner.className = "text-sm font-black text-slate-700 flex items-center gap-1";
          infoOwner.innerHTML = `👤 ${voucherOwner} <span class="ml-1 text-[9px] bg-slate-500 text-white px-1.5 py-0.5 rounded uppercase">Đã Thanh Toán</span>`;
          
          btnSubmit.disabled = true;
          btnSubmit.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
          btnSubmit.innerHTML = "❌ Mã Này Đã Được Thanh Toán";

        } else if (isPending) {
          // Trạng thái: Đang Chờ Duyệt
          infoBox.classList.add('bg-amber-50', 'border-amber-200');
          infoOwner.parentElement.querySelector('span:first-child').className = "text-[10px] uppercase font-black text-amber-600 mb-0.5";
          infoOwner.className = "text-sm font-black text-amber-900 flex items-center gap-1";
          infoOwner.innerHTML = `👤 ${voucherOwner} <span class="ml-1 text-[9px] bg-amber-500 text-white px-1.5 py-0.5 rounded uppercase">Đang Chờ Duyệt</span>`;
          
          btnSubmit.disabled = true;
          btnSubmit.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
          btnSubmit.innerHTML = "⏳ Mã Đang Chờ Admin Duyệt";

        } else {
          // Trạng thái: Hợp lệ & Sẵn sàng
          infoBox.classList.add('bg-emerald-50', 'border-emerald-200');
          infoOwner.parentElement.querySelector('span:first-child').className = "text-[10px] uppercase font-black text-emerald-600 mb-0.5";
          infoOwner.className = "text-sm font-black text-emerald-900 flex items-center gap-1";
          infoOwner.innerHTML = `👤 ${voucherOwner} <span class="ml-1 text-[9px] bg-emerald-500 text-white px-1.5 py-0.5 rounded uppercase">Hợp Lệ</span>`;
          
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed', 'grayscale');
          btnSubmit.innerHTML = "🚀 Gửi Yêu Cầu Cho Admin";
        }
        
      } else {
        // Trạng thái: Mã không tồn tại
        infoValue.textContent = "0";
        infoBox.classList.add('bg-red-50', 'border-red-200');
        infoOwner.parentElement.querySelector('span:first-child').className = "text-[10px] uppercase font-black text-red-600 mb-0.5";
        infoOwner.className = "text-sm font-black text-red-900 flex items-center gap-1";
        infoOwner.innerHTML = `❌ Không tồn tại`;

        btnSubmit.disabled = true;
        btnSubmit.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
        btnSubmit.innerHTML = "⚠️ Mã Không Hợp Lệ";
      }
    });
  </script>
</body>
</html>
